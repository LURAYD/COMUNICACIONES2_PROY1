[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comm2"
version = "1.0.0"
description = "Receptor digital adaptativo sobre canal inalambrico simulado - Comunicaciones II 2026"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pandas>=2.1",
]

[project.optional-dependencies]
# Banco de pruebas de escritorio (app/). El simulador de src/comm2 no depende
# de Qt: quien solo quiera correr la campana por linea de comandos no necesita
# instalar esto.
gui = [
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
]

[tool.setuptools.packages.find]
where = ["src"]
